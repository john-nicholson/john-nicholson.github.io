<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f5f1"/>
  <text x="90" y="175" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" fill="#0b1f3a">Knowledge should persist.</text>
  <text x="90" y="270" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" fill="#2457a6">Attention</text>
  <text x="415" y="270" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" fill="#0b1f3a">should be disposable.</text>
  <text x="90" y="350" font-family="Arial, Helvetica, sans-serif" font-size="33" fill="#4a5568">How I manage notes, tasks and flow with ADHD — and what DevOps taught me</text>
  <line x1="90" y1="405" x2="220" y2="405" stroke="#2457a6" stroke-width="6"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="110" y="540" width="250" height="125" rx="20" fill="#ffffff" stroke="#ccd3dd"/>
    <text x="235" y="595" font-size="29" font-weight="700" fill="#0b1f3a">Capture</text>
    <text x="235" y="635" font-size="22" fill="#5b6574">get it out of my head</text>
    <text x="405" y="615" font-size="42" fill="#2457a6">→</text>
    <rect x="470" y="540" width="250" height="125" rx="20" fill="#ffffff" stroke="#ccd3dd"/>
    <text x="595" y="595" font-size="29" font-weight="700" fill="#0b1f3a">Knowledge</text>
    <text x="595" y="635" font-size="22" fill="#5b6574">make it durable</text>
    <text x="765" y="615" font-size="42" fill="#2457a6">→</text>
    <rect x="830" y="540" width="250" height="125" rx="20" fill="#ffffff" stroke="#ccd3dd"/>
    <text x="955" y="595" font-size="29" font-weight="700" fill="#0b1f3a">Attention</text>
    <text x="955" y="635" font-size="22" fill="#5b6574">what matters now</text>
    <text x="1125" y="615" font-size="42" fill="#2457a6">→</text>
    <rect x="1190" y="540" width="250" height="125" rx="20" fill="#ffffff" stroke="#ccd3dd"/>
    <text x="1315" y="595" font-size="29" font-weight="700" fill="#0b1f3a">Migration</text>
    <text x="1315" y="635" font-size="22" fill="#5b6574">decide what survives</text>
  </g>
  <text x="90" y="795" font-family="Arial, Helvetica, sans-serif" font-size="28" font-style="italic" fill="#4a5568">The goal is flow, not a perfect system.</text>
</svg>
